services:
  postgres:
    image: postgres:15-alpine
    container_name: nardi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nardi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change}
      POSTGRES_DB: ${POSTGRES_DB:-nardi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nardi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nardi_network

  redis:
    image: redis:7-alpine
    container_name: nardi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nardi_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nardi_backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nardi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change}
      POSTGRES_DB: ${POSTGRES_DB:-nardi_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_key}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      DOMAIN: ${DOMAIN:-nardist.site}
      TON_API_URL: ${TON_API_URL:-https://toncenter.com/api/v2}
      TON_API_KEY: ${TON_API_KEY:-}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    networks:
      - nardi_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://nardist.site/api}
        VITE_WS_URL: ${VITE_WS_URL:-wss://nardist.site}
        VITE_TELEGRAM_BOT_NAME: ${VITE_TELEGRAM_BOT_NAME:-}
    container_name: nardi_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://nardist.site/api}
      VITE_WS_URL: ${VITE_WS_URL:-wss://nardist.site}
      VITE_TELEGRAM_BOT_NAME: ${VITE_TELEGRAM_BOT_NAME:-}
    expose:
      - "5173"
    depends_on:
      - backend
    volumes:
      - /app/node_modules
      # Монтируем volume для статических файлов, чтобы nginx мог их читать
      - frontend_static:/usr/share/nginx/html
    networks:
      - nardi_network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nardi_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Монтируем SSL сертификаты с хоста
      - /etc/letsencrypt/live/nardist.site/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/nardist.site/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      # Монтируем статические файлы frontend из контейнера
      - frontend_static:/usr/share/nginx/html:ro
      # Монтируем uploads для прямой отдачи файлов из backend
      - ./backend/uploads:/app/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - nardi_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_static:

networks:
  nardi_network:
    driver: bridge

