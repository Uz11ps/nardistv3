<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="checkerGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="checkerGradientBlack" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Белая шашка -->
  <circle cx="50" cy="50" r="45" fill="url(#checkerGradient)" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="40" cy="40" r="8" fill="rgba(255, 255, 255, 0.6)"/>
  
  <!-- Черная шашка (для примера, можно использовать отдельный файл) -->
  <!-- <circle cx="50" cy="50" r="45" fill="url(#checkerGradientBlack)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="40" cy="40" r="8" fill="rgba(255, 255, 255, 0.2)"/> -->
</svg>

