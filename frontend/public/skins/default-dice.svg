<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Кубик -->
  <rect x="10" y="10" width="80" height="80" rx="8" fill="url(#diceGradient)" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Блик -->
  <ellipse cx="25" cy="25" rx="12" ry="12" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Точки (показываем 1 для примера, в игре будет динамически меняться) -->
  <circle cx="50" cy="50" r="6" fill="#1a1a1a"/>
</svg>
