<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blackCheckerGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
    <filter id="checkerShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Черная шашка -->
  <circle cx="50" cy="50" r="45" fill="url(#blackCheckerGradient)" stroke="#FFFFFF" stroke-width="2" filter="url(#checkerShadow)"/>
  
  <!-- Блик -->
  <ellipse cx="35" cy="35" rx="15" ry="15" fill="#FFFFFF" opacity="0.2"/>
  
  <!-- Внутренний круг для объема -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.5"/>
</svg>

