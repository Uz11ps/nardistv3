<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="whiteCheckerGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </radialGradient>
    <filter id="checkerShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Белая шашка -->
  <circle cx="50" cy="50" r="45" fill="url(#whiteCheckerGradient)" stroke="#1a1a1a" stroke-width="2" filter="url(#checkerShadow)"/>
  
  <!-- Блик -->
  <ellipse cx="35" cy="35" rx="15" ry="15" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Внутренний круг для объема -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#E0E0E0" stroke-width="1" opacity="0.5"/>
</svg>

