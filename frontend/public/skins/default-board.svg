<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightPoint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CD853F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkPoint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD853F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон доски -->
  <rect width="800" height="400" fill="url(#boardGradient)"/>
  
  <!-- Рамка -->
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#654321" stroke-width="8" rx="5"/>
  <rect x="20" y="20" width="760" height="360" fill="none" stroke="#8B4513" stroke-width="2" rx="3"/>
  
  <!-- Центральная линия (бар) -->
  <rect x="380" y="50" width="40" height="300" fill="#654321" rx="3"/>
  <rect x="385" y="55" width="30" height="290" fill="#8B4513" rx="2"/>
  
  <!-- Точки (треугольники) - верхняя часть -->
  <g id="topPoints">
    <!-- Левая сторона (точки 12-7) -->
    <polygon points="20,0 60,0 40,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="80,0 120,0 100,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="140,0 180,0 160,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="200,0 240,0 220,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="260,0 300,0 280,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="320,0 360,0 340,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    
    <!-- Правая сторона (точки 6-1) -->
    <polygon points="420,0 460,0 440,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="480,0 520,0 500,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="540,0 580,0 560,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="600,0 640,0 620,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="660,0 700,0 680,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="720,0 760,0 740,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
  </g>
  
  <!-- Точки (треугольники) - нижняя часть -->
  <g id="bottomPoints">
    <!-- Левая сторона (точки 13-18) -->
    <polygon points="20,400 60,400 40,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="80,400 120,400 100,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="140,400 180,400 160,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="200,400 240,400 220,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="260,400 300,400 280,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="320,400 360,400 340,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    
    <!-- Правая сторона (точки 19-24) -->
    <polygon points="420,400 460,400 440,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="480,400 520,400 500,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="540,400 580,400 560,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="600,400 640,400 620,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="660,400 700,400 680,200" fill="url(#darkPoint)" stroke="#654321" stroke-width="2"/>
    <polygon points="720,400 760,400 740,200" fill="url(#lightPoint)" stroke="#654321" stroke-width="2"/>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="400" cy="200" r="15" fill="#8B4513" opacity="0.3"/>
  <circle cx="400" cy="200" r="8" fill="#654321" opacity="0.5"/>
</svg>
